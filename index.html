<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Icone do D da Dellamed na tela inicial -->
<link rel="apple-touch-icon" sizes="192x192" href="https://raw.githubusercontent.com/dellamed-ia/logodellamed/main/dellamed_icon_192.png">
<link rel="apple-touch-icon" sizes="512x512" href="https://raw.githubusercontent.com/dellamed-ia/logodellamed/main/dellamed_icon_192.png">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/dellamed-ia/logodellamed/main/dellamed_icon_192.png">

<!-- Manifest (Android): nome e icone do atalho -->
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Trade%20Intelligence%20Dellamed%22%2C%22short_name%22%3A%22Trade%20Dellamed%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23012247%22%2C%22theme_color%22%3A%22%23012247%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fraw.githubusercontent.com%2Fdellamed-ia%2Flogodellamed%2Fmain%2Fdellamed_icon_192.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

<style>
  html,body{margin:0;height:100%;background:#012247}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#012247}
</style>
</head>
<body>
<!-- Esta pagina so abre o sistema. Nao ha dados aqui: o acesso exige login com senha. -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxqvMsqU7XoGIFN3k8fPRc0gx4DZ4O6zmYoI85HWtKcGLE-YdX-XVycOvKTEb9_bJeEOw/exec"
        title="Trade Intelligence · Dellamed" allow="clipboard-write; geolocation"></iframe>

<script>
/* Recupera a tela em branco depois de sair do app (abrir o mapa, outro app, trocar de aba).
   O sistema manda um "sinal de vida" a cada 2s. Se o sinal ja chegou alguma vez e some
   quando voltamos para a tela, o quadro morreu: recarregamos so ele.
   Se o sinal nunca chegou (versao antiga do sistema), nada e recarregado. */
(function(){
  var ultimoSinal = 0, jaRecebeu = false, conferindo = null;

  /* O tema (claro/escuro) e escolhido dentro do sistema. Esta pagina so pinta o
     fundo da mesma cor, para nao aparecer uma borda azul-escura no tema claro.
     A cor fica guardada aqui tambem, para ja abrir certo da proxima vez. */
  function pintarFundo(cor){
    if(!cor) return;
    document.documentElement.style.background = cor;
    document.body.style.background = cor;
    var f = document.getElementById("app"); if(f) f.style.background = cor;
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", cor);
    try{ localStorage.setItem("trade_fundo", cor); }catch(e){}
  }
  try{ pintarFundo(localStorage.getItem("trade_fundo")); }catch(e){}

  window.addEventListener("message", function(e){
    if(e && e.data && e.data.app === "trade-dellamed"){
      ultimoSinal = Date.now(); jaRecebeu = true;
      if(e.data.fundo) pintarFundo(e.data.fundo);
    }
  });
  function conferir(){
    if(!jaRecebeu || document.hidden) return;
    clearTimeout(conferindo);
    conferindo = setTimeout(function(){
      if(document.hidden) return;
      if(Date.now() - ultimoSinal > 4500){          // parou de responder: recarrega o quadro
        var f = document.getElementById("app");
        if(f) f.src = f.src;
        ultimoSinal = Date.now();
      }
    }, 3500);
  }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) conferir(); });
  window.addEventListener("focus", conferir);
  window.addEventListener("pageshow", conferir);
})();
</script>
</body>
</html>
